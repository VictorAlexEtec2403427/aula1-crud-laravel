services:
  Linux_Center:
    image: alpine:3.22
    container_name: Linux_Center
    stdin_open: true
    tty: true
    working-dir: /home
    command: /bin/sh
    volumes:
      - ./:/home:z
    networks:
      - VAMGnet

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3307:3306"
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
    networks:
      - VAMGnet

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_gui
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - escola_network

networks:
  VAMGnet:
    driver:bridge
